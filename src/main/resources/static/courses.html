<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Courses - LearnHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-transition">
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
                LearnHub
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="courses.html" class="nav-link active">Courses</a>
            </div>
            <div class="nav-auth" id="nav-auth">
                <a href="login.html" class="btn btn-ghost btn-sm">Sign In</a>
                <a href="login.html" class="btn btn-primary btn-sm">Get Started</a>
            </div>
            <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
        </div>
    </nav>

    <div style="background: linear-gradient(135deg, var(--dark-900) 0%, var(--dark-800) 40%, #1e1b4b 100%); color: white; padding: 4rem 2rem; position: relative; overflow: hidden;">
        <div style="position: absolute; top: -50%; right: -10%; width: 500px; height: 500px; background: radial-gradient(circle, rgba(99,102,241,0.1) 0%, transparent 60%); border-radius: 50%;"></div>
        <div style="max-width: 1280px; margin: 0 auto; position: relative; z-index: 1;">
            <h1 style="color: white; font-size: clamp(2rem, 4vw, 3rem); margin-bottom: 0.75rem; animation: fadeInUp 0.6s ease;">Explore Courses</h1>
            <p style="color: var(--gray-400); font-size: 1.0625rem; animation: fadeInUp 0.6s ease 0.1s both;">Discover courses to advance your skills and career</p>
        </div>
    </div>

    <section class="section">
        <div class="section-container">
            <div class="search-bar animate-fade-in-up">
                <div class="search-input-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    <input type="text" class="form-input" id="search-input" placeholder="Search courses, instructors, topics...">
                </div>
                <select class="form-select" id="sort-select" style="width: 200px;">
                    <option value="">Sort by</option>
                    <option value="rating">Highest Rated</option>
                    <option value="students">Most Popular</option>
                    <option value="newest">Newest</option>
                </select>
            </div>

            <div class="filter-tags animate-fade-in-up stagger-2" id="category-filters">
                <button class="filter-tag active" data-category="">All</button>
            </div>

            <div class="grid grid-cols-1 grid-cols-2 grid-cols-3 grid-cols-4" id="courses-grid">
                <div class="loading-spinner"></div>
            </div>

            <div id="courses-empty" class="empty-state hidden">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                <h3>No courses found</h3>
                <p>Try adjusting your search or filters</p>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-bottom" style="border: none; padding-top: 0;">
                <p>&copy; 2026 LearnHub. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/courses.js"></script>
</body>
</html>
